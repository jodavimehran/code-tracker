# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
#      OAuthToken: ${{ secrets.OAUTHTOKEN }}
      releaseVersion: CI-RM-SNAPSHOT

    steps:
      # Reuse the git objects of an earlier master build, including those of the oracle submodule, so that the checkout
      # fetches only the objects changed since then. The checkout reuses a .git with the same remote.
      - name: Restore git objects
        uses: actions/cache/restore@v4
        with:
          path: .git
          key: git-${{ runner.os }}-${{ github.sha }}
          restore-keys: git-${{ runner.os }}-

      # The credentials are not kept in .git/config, so that the cached .git does not contain the token
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false

      # Drop the objects of the older snapshot, so that the cache does not grow with every build (small fetches leave loose objects, which only prune removes)
      - name: Drop git objects of older snapshots
        if: github.ref == 'refs/heads/master'
        run: |
          git reflog expire --expire=now --all && git repack -a -d -q && git prune --expire=now
          git submodule foreach --quiet 'git reflog expire --expire=now --all && git repack -a -d -q && git prune --expire=now'

      - name: Save git objects
        if: github.ref == 'refs/heads/master'
        uses: actions/cache/save@v4
        with:
          path: .git
          key: git-${{ runner.os }}-${{ github.sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          maven-version: '3.9.6'

#      - name : Clone repos in tmp folder
#        run: |
#          mkdir -p tmp &&
#          cd tmp &&
#          git clone --no-checkout https://github.com/apache/hadoop && mv hadoop apache\\hadoop
#          git clone --no-checkout https://github.com/apache/flink && mv flink apache\\flink
#          git clone --no-checkout https://github.com/apache/commons-lang && mv commons-lang apache\\commons-lang
#          git clone --no-checkout https://github.com/apache/commons-io && mv commons-io apache\\commons-io
#          git clone --no-checkout https://github.com/apache/lucene-solr && mv lucene-solr apache\\lucene-solr
#          git clone --no-checkout https://github.com/checkstyle/checkstyle && mv checkstyle checkstyle\\checkstyle
#          git clone --no-checkout https://github.com/elastic/elasticsearch && mv elasticsearch elasticsearch\\elasticsearch
#          git clone --no-checkout https://github.com/eclipse/jetty.project && mv jetty.project eclipse\\jetty
#          git clone --no-checkout https://github.com/hibernate/hibernate-orm && mv hibernate-orm hibernate\\hibernate-orm
#          git clone --no-checkout https://github.com/hibernate/hibernate-search && mv hibernate-search hibernate\\hibernate-search
#          git clone --no-checkout https://github.com/javaparser/javaparser && mv javaparser javaparser\\javaparser
#          git clone --no-checkout https://github.com/Jetbrains/intellij-community && mv intellij-community intellij\\intellij-community
#          git clone --no-checkout https://github.com/junit-team/junit4 && mv junit4 junit-team\\junit4
#          git clone --no-checkout https://github.com/junit-team/junit5 && mv junit5 junit-team\\junit5
#          git clone --no-checkout https://github.com/mockito/mockito && mv mockito mockito\\mockito
#          git clone --no-checkout https://github.com/spring-projects/spring-boot && mv spring-boot spring-projects\\spring-boot
#          git clone --no-checkout https://github.com/spring-projects/spring-framework && mv spring-framework spring-projects\\spring-framework
#          git clone --no-checkout https://github.com/square/okhttp && mv okhttp square\\okhttp
#          git clone --no-checkout https://gerrit.googlesource.com/jgit && mv jgit eclipse\\jgit
#          git clone --no-checkout https://github.com/pmd/pmd && mv pmd pmd\\pmd

      - name: Find the RefactoringMiner master commit
        id: rm
        run: echo "sha=$(git ls-remote https://github.com/tsantalis/RefactoringMiner.git refs/heads/master | cut -f1)" >> "$GITHUB_OUTPUT"

      # Reuse the git objects of the RefactoringMiner commit of an earlier build, so that the fetch downloads only
      # the objects changed since then, instead of the whole tree of its test resources
      - name: Restore RefactoringMiner git objects
        id: rm-cache
        uses: actions/cache/restore@v4
        with:
          path: RefactoringMiner/.git
          key: rm-git-${{ runner.os }}-${{ steps.rm.outputs.sha }}
          restore-keys: rm-git-${{ runner.os }}-

      - name: Fetch RefactoringMiner
        run: |
          mkdir -p RefactoringMiner && cd RefactoringMiner
          if [ ! -d .git ]; then
            git init -q && git remote add origin https://github.com/tsantalis/RefactoringMiner.git
          fi
          git fetch -q --depth 1 origin ${{ steps.rm.outputs.sha }}
          git checkout -q -f -B master FETCH_HEAD
          git clean -q -ffdx

      # Drop the objects of the older RefactoringMiner commit, so that the cache does not grow with every build
      - name: Drop RefactoringMiner git objects of older snapshots
        if: github.ref == 'refs/heads/master' && steps.rm-cache.outputs.cache-hit != 'true'
        working-directory: RefactoringMiner
        run: git reflog expire --expire=now --all && git repack -a -d -q && git prune --expire=now

      - name: Save RefactoringMiner git objects
        if: github.ref == 'refs/heads/master' && steps.rm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: RefactoringMiner/.git
          key: rm-git-${{ runner.os }}-${{ steps.rm.outputs.sha }}

      - name: Publish RefactoringMiner to the local Maven repository
        working-directory: RefactoringMiner
        run: ./gradlew publishToMavenLocal -x test -x javadoc -PbuildVersion=${{ env.releaseVersion }}

      - name: Build with Maven
        run: ./mvnw -Drm.version=${{ env.releaseVersion }} -B package --file pom.xml



